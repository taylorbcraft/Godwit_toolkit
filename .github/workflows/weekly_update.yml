name: Deploy Flyway Tracking Summary

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/weekly_update.yml'
      - 'Flyway_Tracking_Summary_App/**'
      - 'renv.lock'

concurrency:
  group: flyway-tracking-summary-deploy
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    env:
      MOVEBANK_USER: ${{ secrets.MOVEBANK_USER }}
      MOVEBANK_PASSWORD: ${{ secrets.MOVEBANK_PASSWORD }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up R 4.4.2
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libproj-dev libgeos-dev libudunits2-dev gdal-bin

      - name: Restore and cache R packages
        uses: r-lib/actions/setup-renv@v2

      - name: Check Movebank credentials
        if: github.event_name != 'push'
        run: Rscript -e "stopifnot(nzchar(Sys.getenv('MOVEBANK_USER')), nzchar(Sys.getenv('MOVEBANK_PASSWORD')))"

      - name: Update location data
        if: github.event_name != 'push'
        run: Rscript import_location_data.R

      - name: Deploy Flyway Tracking Summary to shinyapps.io
        run: |
          Rscript -e "library(rsconnect);
                      rsconnect::setAccountInfo(name = '${{ secrets.SHINYAPPS_ACCOUNT }}',
                                                token = '${{ secrets.SHINYAPPS_TOKEN }}',
                                                secret = '${{ secrets.SHINYAPPS_SECRET }}');
                      rsconnect::deployApp(appDir = 'Flyway_Tracking_Summary_App', quarto = NA, forceUpdate = TRUE)"
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
