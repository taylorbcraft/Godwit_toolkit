name: Refresh and deploy Godwit Explorer

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/weekly_update.yml'
      - 'Flyway_Tracking_Summary_App/**'
      - 'import_location_data.R'
      - 'renv.lock'

permissions:
  contents: read

concurrency:
  group: godwit-explorer-deploy
  cancel-in-progress: true

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    env:
      MOVEBANK_USER: ${{ secrets.MOVEBANK_USER }}
      MOVEBANK_PASSWORD: ${{ secrets.MOVEBANK_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'

      - name: Install spatial system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libproj-dev libgeos-dev libudunits2-dev gdal-bin

      - name: Restore R packages
        uses: r-lib/actions/setup-renv@v2

      - name: Install deployment package
        run: Rscript --vanilla -e "install.packages('rsconnect', repos = 'https://cloud.r-project.org')"

      - name: Validate source
        run: |
          Rscript --vanilla -e "invisible(parse(file = 'Flyway_Tracking_Summary_App/app.R'))"
          Rscript --vanilla -e "invisible(parse(file = 'import_location_data.R'))"
          node --check "GEE_code/Satellite Index Explorer.js"

      - name: Check Movebank credentials
        if: github.event_name != 'push'
        run: Rscript --vanilla -e "stopifnot(nzchar(Sys.getenv('MOVEBANK_USER')), nzchar(Sys.getenv('MOVEBANK_PASSWORD')))"

      - name: Refresh movement data
        if: github.event_name != 'push'
        run: Rscript --vanilla import_location_data.R

      - name: Deploy application
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          Rscript --vanilla -e "
            rsconnect::setAccountInfo(
              name = Sys.getenv('SHINYAPPS_ACCOUNT'),
              token = Sys.getenv('SHINYAPPS_TOKEN'),
              secret = Sys.getenv('SHINYAPPS_SECRET')
            )
            rsconnect::deployApp(
              appDir = 'Flyway_Tracking_Summary_App',
              quarto = NA,
              forceUpdate = TRUE
            )
          "
